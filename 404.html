<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden — Benji Holiday</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#e7ccbd">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 404 ist bewusst selbst-enthaltend (Inline-CSS, keine Partials/Fetches),
     damit sie unter jeder URL-Tiefe korrekt rendert. -->
<style>
  :root{--ton:#e7ccbd;--creme:#f7ece3;--glut:#c2482a;--glut2:#9c3620;--sonne:#e8973a;--espresso:#291a12}
  *{box-sizing:border-box;margin:0}
  body{font-family:'Instrument Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--ton);color:var(--espresso);min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;overflow:hidden;position:relative}
  .glow{position:absolute;top:20%;left:50%;width:min(120vw,700px);aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(circle,rgba(232,151,58,.5),rgba(194,72,42,.2) 40%,transparent 65%);filter:blur(8px);pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:34rem}
  .code{font-family:Georgia,'Times New Roman',serif;font-size:clamp(5rem,22vw,11rem);line-height:.9;font-weight:500;letter-spacing:-.03em;color:var(--espresso)}
  .sun{width:70px;height:35px;margin:0 auto 1.4rem;overflow:hidden;position:relative}
  .sun::after{content:"";position:absolute;left:50%;top:0;width:52px;height:52px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 60%,var(--sonne),var(--glut) 70%);box-shadow:0 0 34px 4px rgba(232,151,58,.6)}
  h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(1.4rem,4vw,2rem);margin:.4rem 0 1rem}
  p{color:#4c3628;line-height:1.6}
  .btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.8rem;background:var(--glut);color:var(--creme);font-weight:600;text-decoration:none;padding:.9rem 1.6rem;border-radius:999px;transition:transform .2s,background .2s}
  .btn:hover{background:var(--glut2);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="wrap">
  <div class="sun" aria-hidden="true"></div>
  <div class="code">404</div>
  <h1>Diese Bühne ist leer</h1>
  <p>Die Seite, die du suchst, gibt es nicht (mehr). Vielleicht ein alter Link oder ein Tippfehler. Zurück ans Licht:</p>
  <a class="btn" href="/">Zur Startseite →</a>
</div>
</body>
</html>
